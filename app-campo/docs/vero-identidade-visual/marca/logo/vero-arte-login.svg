<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Arte VERO — vale, curvas de nível e rede de irrigação">
  <!-- Painel de marca da tela de acessar (15/09/2026). Mesma linguagem do fundo
       vero_login_bg.svg (vale, curvas de nível, rio, válvulas de irrigação),
       recomposta para o quadro quase quadrado do cartão e com mais contraste.
       É substituída por uma foto quando o cliente joga uma imagem em
       storage/marca/ (ver assets/img/marca/README.md). -->
  <defs>
    <linearGradient id="ceu" x1=".1" y1="0" x2=".6" y2="1">
      <stop offset="0"   stop-color="#063E45"/>
      <stop offset=".36" stop-color="#005059"/>
      <stop offset=".72" stop-color="#013A42"/>
      <stop offset="1"   stop-color="#001F24"/>
    </linearGradient>
    <radialGradient id="brilho" cx=".24" cy=".16" r=".66">
      <stop offset="0" stop-color="#12A08F" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0E7E72" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ouro" cx=".66" cy=".97" r=".62">
      <stop offset="0"   stop-color="#E2C275" stop-opacity=".30"/>
      <stop offset=".45" stop-color="#C9A961" stop-opacity=".10"/>
      <stop offset="1"   stop-color="#C9A961" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vinheta" cx=".5" cy=".45" r=".8">
      <stop offset="0"   stop-color="#001A1E" stop-opacity="0"/>
      <stop offset=".55" stop-color="#001A1E" stop-opacity="0"/>
      <stop offset="1"   stop-color="#00161A" stop-opacity=".58"/>
    </radialGradient>
    <filter id="suave" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="900" height="900" fill="url(#ceu)"/>
  <rect width="900" height="900" fill="url(#brilho)"/>
  <rect width="900" height="900" fill="url(#ouro)"/>

  <!-- curvas de nível (identidade "mapa"): foco alto à direita, foco baixo à esquerda -->
  <g stroke="#7FD3D6" fill="none" stroke-width="1.7">
    <g transform="translate(640 300) rotate(-14)">
      <ellipse rx="86"  ry="62"  opacity=".40"/>
      <ellipse rx="150" ry="108" opacity=".32"/>
      <ellipse rx="228" ry="162" opacity=".25"/>
      <ellipse rx="318" ry="224" opacity=".19"/>
      <ellipse rx="420" ry="292" opacity=".14"/>
      <ellipse rx="540" ry="372" opacity=".10"/>
      <ellipse rx="670" ry="456" opacity=".07"/>
    </g>
    <g transform="translate(150 760) rotate(12)">
      <ellipse rx="80"  ry="56"  opacity=".26"/>
      <ellipse rx="158" ry="110" opacity=".19"/>
      <ellipse rx="248" ry="172" opacity=".13"/>
      <ellipse rx="350" ry="240" opacity=".09"/>
    </g>
  </g>

  <!-- rio / vale cruzando o quadro -->
  <g>
    <path d="M-30 604 C 170 548, 330 676, 520 622 S 790 508, 940 566"
          fill="none" stroke="#8FD6DA" stroke-width="16" stroke-linecap="round" opacity=".20" filter="url(#suave)"/>
    <path d="M-30 604 C 170 548, 330 676, 520 622 S 790 508, 940 566"
          fill="none" stroke="#CFEFF1" stroke-width="2.4" stroke-linecap="round" opacity=".42"/>
  </g>

  <!-- fileiras do parreiral convergindo (perspectiva) -->
  <g stroke="#7FD3D6" stroke-width="1.5" opacity=".18">
    <path d="M470 560 L40 900"/>
    <path d="M470 560 L230 900"/>
    <path d="M470 560 L430 900"/>
    <path d="M470 560 L650 900"/>
    <path d="M470 560 L880 900"/>
  </g>

  <!-- rede de irrigação: válvulas ligadas por linhas finas -->
  <g stroke="#28F0D3" stroke-width="1.3" opacity=".55" fill="none">
    <path d="M210 450 L390 500 L600 436 L780 496 M390 500 L470 670 L680 700 M600 436 L700 306"/>
  </g>
  <g fill="#28F0D3">
    <circle cx="210" cy="450" r="3.6" opacity=".75"/>
    <circle cx="390" cy="500" r="6"   opacity=".55" filter="url(#suave)"/>
    <circle cx="390" cy="500" r="3"   opacity="1"/>
    <circle cx="600" cy="436" r="3.6" opacity=".8"/>
    <circle cx="780" cy="496" r="3.2" opacity=".65"/>
    <circle cx="470" cy="670" r="3.2" opacity=".65"/>
    <circle cx="680" cy="700" r="6"   opacity=".5" filter="url(#suave)"/>
    <circle cx="680" cy="700" r="2.8" opacity="1"/>
  </g>
  <g fill="#E2C275">
    <circle cx="700" cy="306" r="6"   opacity=".55" filter="url(#suave)"/>
    <circle cx="700" cy="306" r="2.6" opacity="1"/>
  </g>

  <!-- partículas altas -->
  <g fill="#CFEFF1">
    <circle cx="120" cy="120" r="1.8" opacity=".55"/>
    <circle cx="330" cy="70"  r="1.4" opacity=".45"/>
    <circle cx="600" cy="120" r="1.7" opacity=".5"/>
    <circle cx="810" cy="196" r="1.4" opacity=".4"/>
    <circle cx="230" cy="260" r="1.3" opacity=".35"/>
    <circle cx="840" cy="640" r="1.5" opacity=".4"/>
  </g>

  <rect width="900" height="900" fill="url(#vinheta)"/>
</svg>
