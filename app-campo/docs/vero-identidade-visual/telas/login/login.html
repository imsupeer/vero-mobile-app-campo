<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#005059" />
    <title>VERO · Acessar — referência visual</title>

    <!--
  =========================================================================
  TELA DE ACESSO — versão de referência, só o visual.

  Extraída da tela real do sistema (index.php). Abra no navegador: ela
  funciona sozinha, sem servidor.

  O que foi retirado em relação à original:
    · a lógica PHP de autenticação, CSRF e sessão;
    · a marca-branca do cliente (a original troca logo e arte por cliente);
    · o vídeo de transição após o login.

  O que foi trocado:
    · a família 'Supreme' virou 'Inter'. A Supreme tem licença própria da
      Befonts e não foi redistribuída neste pacote. Repare que a tela de
      acesso real ainda usa Supreme enquanto o resto do sistema já migrou
      para Poppins + Inter — é uma inconsistência conhecida, ver
      ../../LEIA-ME.md.

  O comportamento de tela foi mantido: mostrar/ocultar senha, avisos com
  aria-live, sacudida no erro e estado de carregando no botão.
  =========================================================================
-->

    <link rel="icon" type="image/svg+xml" href="../../marca/logo/vero-symbol.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../marca/favicons/favicon-vero-32.png" />
    <link rel="apple-touch-icon" href="../../marca/favicons/favicon-vero-180.png" />
    <link rel="stylesheet" href="../../tipografia/fontes/vero-fonts.css" />
    <style>
      /* =========================================================================
   VERO: tela de acessar (15/09/2026)
   Cartão dividido: formulário objetivo à esquerda, arte/marca à direita.
   Mantém o clima da tela anterior (fundo teal profundo, contornos do vale,
   microcopy em mono) com a interface nova, mais direta.
   ========================================================================= */
      :root {
        --teal: #005059;
        --teal-2: #00363d;
        --teal-3: #4e9ca1;
        --fundo: #04262b;
        --fundo-2: #07343a;
        --ink: #17232b;
        --ink-2: #5a6b74;
        --linha: #dfe5e7;
        --branco: #fff;
        --gold: #e2c275;
        --danger: #b3261e;
        --danger-bg: #fae6e3;
        --ok: #0e7e72;
        --ok-bg: #dcefeb;
        --r: 18px;
        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--ink);
        background: var(--fundo);
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        position: relative;
        overflow-x: hidden;
      }
      /* atmosfera do fundo. Mesmo teal e os brilhos da tela anterior */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          linear-gradient(160deg, rgba(5, 47, 53, 0.82) 0%, rgba(4, 38, 43, 0.88) 55%, rgba(3, 32, 36, 0.94) 100%),
          url('../../imagens/vero_login_bg.svg') center/cover no-repeat,
          var(--fundo);
      }
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.35;
        background-image:
          linear-gradient(rgba(78, 156, 161, 0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(78, 156, 161, 0.07) 1px, transparent 1px);
        background-size: 64px 64px;
        -webkit-mask-image: radial-gradient(70% 60% at 50% 45%, #000, transparent 100%);
        mask-image: radial-gradient(70% 60% at 50% 45%, #000, transparent 100%);
      }
      .mono {
        font-family: 'Inter', ui-monospace, monospace;
      }

      /* ---------------------------------------------------- palco / cartão --- */
      .stage {
        position: relative;
        z-index: 1;
        width: 100%;
        display: grid;
        place-items: center;
        transition:
          opacity 0.45s var(--ease),
          transform 0.45s var(--ease);
      }
      .stage.is-leaving {
        opacity: 0;
        transform: scale(0.985);
      }
      .card {
        width: min(980px, 100%);
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        background: var(--branco);
        border-radius: var(--r);
        overflow: hidden;
        box-shadow:
          0 30px 90px rgba(0, 0, 0, 0.45),
          0 0 0 1px rgba(255, 255, 255, 0.07);
        opacity: 0;
        transform: translateY(16px);
        animation: entra 0.55s var(--ease) 0.08s forwards;
      }
      @keyframes entra {
        to {
          opacity: 1;
          transform: none;
        }
      }
      .card.is-shake {
        animation: treme 0.42s var(--ease);
      }
      @keyframes treme {
        10%,
        90% {
          transform: translateX(-2px);
        }
        30%,
        70% {
          transform: translateX(4px);
        }
        50% {
          transform: translateX(-4px);
        }
      }
      .card.is-busy {
        pointer-events: none;
      }

      /* ------------------------------------------------------- formulário --- */
      .card__form {
        padding: 40px 42px 24px;
        display: flex;
        flex-direction: column;
        position: relative;
        min-width: 0;
      }
      .card__vero {
        position: absolute;
        top: 26px;
        right: 30px;
        height: 26px;
        width: auto;
        opacity: 0.9;
      }
      .card__form h1 {
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      .card__sub {
        margin-top: 6px;
        font-size: 13px;
        color: var(--ink-2);
      }
      .card__form form {
        margin-top: 24px;
      }

      .field {
        margin-bottom: 18px;
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: var(--ink);
        margin-bottom: 4px;
      }
      .field__box {
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 1.5px solid var(--linha);
        padding: 4px 2px;
        transition: border-color 0.16s var(--ease);
      }
      .field__box:focus-within {
        border-color: var(--teal);
      }
      .field input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: none;
        padding: 8px 0;
        font:
          15px/1.4 'Inter',
          system-ui,
          sans-serif;
        color: var(--ink);
      }
      .field input::placeholder {
        color: #a7b3b8;
      }
      .field.is-invalid .field__box {
        border-color: var(--danger);
      }
      .field__olho {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--ink-2);
        cursor: pointer;
        transition: background 0.14s;
      }
      .field__olho:hover {
        background: #f1f4f5;
        color: var(--teal);
      }
      .field__olho svg {
        width: 19px;
        height: 19px;
      }

      .row {
        display: flex;
        justify-content: flex-end;
        margin: -6px 0 4px;
      }
      .link {
        border: 0;
        background: none;
        font:
          500 12.5px 'Inter',
          sans-serif;
        color: var(--teal);
        cursor: pointer;
        padding: 4px 2px;
      }
      .link:hover {
        color: var(--teal-2);
      }

      .btn {
        margin-top: 14px;
        width: 100%;
        min-height: 50px;
        border: 0;
        border-radius: 11px;
        background: var(--teal);
        color: #fff;
        font:
          700 13px 'Inter',
          sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
        display: grid;
        place-items: center;
        position: relative;
        transition:
          background 0.16s var(--ease),
          transform 0.1s;
      }
      .btn:hover {
        background: var(--teal-2);
      }
      .btn:active {
        transform: scale(0.995);
      }
      .btn__label {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: opacity 0.16s;
      }
      .btn__label svg {
        width: 17px;
        height: 17px;
      }
      .btn__spinner {
        position: absolute;
        width: 19px;
        height: 19px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        border-radius: 50%;
        opacity: 0;
        animation: gira 0.7s linear infinite;
      }
      .btn.is-loading .btn__label {
        opacity: 0;
      }
      .btn.is-loading .btn__spinner {
        opacity: 1;
      }
      @keyframes gira {
        to {
          transform: rotate(360deg);
        }
      }

      .notice {
        display: none;
        align-items: flex-start;
        gap: 9px;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 13px;
        line-height: 1.35;
        margin-bottom: 4px;
      }
      .notice.show {
        display: flex;
      }
      .notice svg {
        width: 17px;
        height: 17px;
        flex: none;
        margin-top: 1px;
      }
      .notice.is-error {
        background: var(--danger-bg);
        color: #8f2a20;
      }
      .notice.is-ok {
        background: var(--ok-bg);
        color: #0a5c53;
      }
      .notice.is-info {
        background: #edf3f4;
        color: #31555a;
      }

      .foot {
        margin-top: auto;
        padding-top: 26px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 11px;
        color: #8fa0a6;
      }
      .foot__dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--ok);
        flex: none;
        box-shadow: 0 0 0 3px rgba(14, 126, 114, 0.14);
      }
      .foot__sep {
        color: #c7d2d6;
      }

      /* -------------------------------------------------------------- arte --- */
      .arte {
        position: relative;
        min-height: 440px;
        display: grid;
        place-items: center;
        padding: 30px;
        background: #00363d var(--foto, none) center/cover no-repeat;
        isolation: isolate;
      }
      .arte::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(155deg, rgba(0, 54, 61, 0.38) 0%, rgba(0, 80, 89, 0.34) 45%, rgba(3, 32, 36, 0.72) 100%);
      }
      .arte--padrao::before {
        background: linear-gradient(155deg, rgba(0, 54, 61, 0.1), rgba(3, 32, 36, 0.22));
      }
      .arte__conteudo {
        position: relative;
        display: grid;
        justify-items: center;
        padding: 26px 18px;
        border-radius: 26px;
        background: radial-gradient(64% 62% at 50% 46%, rgba(0, 22, 26, 0.42), rgba(0, 22, 26, 0) 72%);
      }
      .arte__marca {
        width: min(158px, 44%);
        aspect-ratio: 1;
        border-radius: 28px;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(4, 28, 32, 0.9);
        backdrop-filter: blur(2px);
        box-shadow:
          0 18px 50px rgba(0, 0, 0, 0.35),
          inset 0 0 0 1px rgba(255, 255, 255, 0.07);
      }
      .arte__marca img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
      }
      .arte__txt {
        margin-top: 18px;
        text-align: center;
        color: #eff6f6;
        text-shadow: 0 1px 14px rgba(0, 0, 0, 0.4);
      }
      .arte__txt strong {
        display: block;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .arte__txt span {
        display: block;
        margin-top: 4px;
        font-size: 12.5px;
        color: rgba(239, 246, 246, 0.76);
        letter-spacing: 0.02em;
      }

      /* -------------------------------------------------------- responsivo --- */
      @media (max-width: 880px) {
        body {
          padding: 0;
          place-items: stretch;
        }
        .card {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
          border-radius: 0;
          min-height: 100dvh;
        }
        .arte {
          order: -1;
          min-height: 0;
          height: 190px;
          padding: 18px;
        }
        .arte__conteudo {
          padding: 10px 14px;
        }
        .arte__marca {
          width: 88px;
          border-radius: 20px;
          padding: 12px;
        }
        .arte__txt {
          margin-top: 10px;
        }
        .arte__txt strong {
          font-size: 16px;
        }
        .arte__txt span {
          display: none;
        }
        .card__form {
          padding: 28px 22px 22px;
        }
        .card__vero {
          display: none;
        }
        .foot {
          padding-top: 20px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .card,
        .stage,
        .btn {
          animation: none !important;
          transition: none !important;
          opacity: 1;
          transform: none;
        }
      }

      /* ------------------------------------------- transição para o painel --- */
      .success {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        place-items: center;
        background: var(--fundo);
      }
      .success.show {
        display: grid;
        animation: aparece 0.3s var(--ease);
      }
      @keyframes aparece {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .success__vid {
        width: 190px;
        height: 190px;
        object-fit: contain;
      }
    </style>
  </head>

  <body>
    <main class="stage">
      <section class="card" id="panel">
        <!-- FORMULÁRIO -->
        <div class="card__form">
          <img class="card__vero" src="../../marca/logo/vero-lockup.svg" alt="VERO" />
          <h1>Acessar</h1>
          <p class="card__sub">Gestão de dentro e fora da porteira</p>

          <form id="loginForm" action="" method="post" novalidate autocomplete="on">
            <input type="hidden" name="csrf_token" value="" />
            <input type="hidden" name="redirect" value="" />

            <div class="notice show" id="notice" role="status" aria-live="polite">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 8v4M12 16h.01" />
              </svg>

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9" />
                <path d="m8.5 12 2.5 2.5 4.5-5" />
              </svg>

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 11v5M12 8h.01" />
              </svg>

              <p style="margin: 0"></p>
            </div>

            <div class="notice" id="notice" role="status" aria-live="polite"></div>

            <div class="field">
              <label for="email">Usuário / E-mail</label>
              <div class="field__box">
                <input
                  id="email"
                  name="email"
                  type="text"
                  inputmode="email"
                  autocomplete="username"
                  placeholder="seu.email@fazenda.com.br"
                  value=""
                  aria-required="true"
                  required
                />
              </div>
            </div>

            <div class="field">
              <label for="senha">Senha</label>
              <div class="field__box">
                <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="••••••••" aria-required="true" required />
                <button class="field__olho" id="togglePwd" type="button" aria-label="Mostrar senha" aria-pressed="false">
                  <svg
                    id="eyeIcon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="row"><button class="link" type="button" id="forgot">Esqueceu sua senha?</button></div>

            <button class="btn" id="submitBtn" type="submit">
              <i class="btn__spinner" aria-hidden="true"></i>
              <span class="btn__label">
                Acessar login
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12h13M12 5l7 7-7 7" />
                </svg>
              </span>
            </button>
          </form>

          <footer class="foot">
            <span class="foot__dot" aria-hidden="true"></span>
            <span class="mono">ACESSO SEGURO</span>
            <span class="foot__sep">·</span>
            <span>VERO by Origo © 2026</span>
          </footer>
        </div>

        <!-- ARTE / MARCA DO CLIENTE (pasta dedicada — assets/img/marca/README.md) -->
        <aside class="arte" style="--foto: url('')">
          <div class="arte__conteudo">
            <div class="arte__marca">
              <img src="" alt="VERO" />
            </div>

            <div class="arte__txt">
              <strong>VERO</strong>
              <span>Gestão de dentro e fora da porteira</span>
            </div>
          </div>
        </aside>
      </section>
    </main>

    <!-- O vídeo de transição pós-login da tela original não vai neste pacote. -->

    <script>
      /* =========================================================================
   Comportamento de tela. Nesta versão de referência o envio não vai a
   servidor nenhum: ele só demonstra o estado de "carregando".
   ========================================================================= */
      (function () {
        'use strict';
        const $ = (sel) => document.querySelector(sel);
        const panel = $('#panel'),
          form = $('#loginForm'),
          email = $('#email'),
          senha = $('#senha');
        const submitBtn = $('#submitBtn'),
          notice = $('#notice'),
          togglePwd = $('#togglePwd');
        const eyeIcon = $('#eyeIcon'),
          forgot = $('#forgot');

        window.setTimeout(() => {
          if (email) email.focus({ preventScroll: true });
        }, 250);

        /* mostrar / ocultar senha */
        const EYE_OPEN = '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
        const EYE_OFF =
          '<path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.2 4.2M9.4 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3 3.6M6.1 6.1A16 16 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 3-.5"/>';
        togglePwd.addEventListener('click', () => {
          const show = senha.type === 'password';
          senha.type = show ? 'text' : 'password';
          eyeIcon.innerHTML = show ? EYE_OFF : EYE_OPEN;
          togglePwd.setAttribute('aria-pressed', String(show));
          togglePwd.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
          senha.focus();
        });

        const ICON = {
          error:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>',
          ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
          info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
        };
        function showNotice(type, text) {
          notice.className = 'notice show ' + { error: 'is-error', ok: 'is-ok', info: 'is-info' }[type];
          notice.innerHTML = ICON[type] + '<p style="margin:0"></p>';
          /* textContent, nunca innerHTML: o texto pode vir do servidor */
          notice.querySelector('p').textContent = text;
        }
        function clearNotice() {
          notice.className = 'notice';
          notice.innerHTML = '';
        }

        function markInvalid(input, on) {
          input.closest('.field').classList.toggle('is-invalid', on);
          input.setAttribute('aria-invalid', String(on));
        }
        [email, senha].forEach((inp) =>
          inp.addEventListener('input', () => {
            markInvalid(inp, false);
            clearNotice();
          }),
        );
        function attention(msg) {
          showNotice('error', msg);
          /* reinicia a animação: sem o reflow, sacudir duas vezes seguidas não funciona */
          panel.classList.remove('is-shake');
          void panel.offsetWidth;
          panel.classList.add('is-shake');
        }

        let busy = false;
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          if (busy) return;
          let invalid = false;
          if (!email.value.trim()) {
            markInvalid(email, true);
            invalid = true;
          }
          if (!senha.value) {
            markInvalid(senha, true);
            invalid = true;
          }
          if (invalid) {
            attention('Preencha usuário e senha para continuar.');
            return;
          }

          setLoading(true);
          window.setTimeout(() => {
            setLoading(false);
            showNotice('ok', 'Referência visual: nenhum envio foi feito.');
          }, 1400);
        });
        function setLoading(on) {
          busy = on;
          submitBtn.classList.toggle('is-loading', on);
          submitBtn.disabled = on;
          submitBtn.setAttribute('aria-busy', String(on));
          panel.classList.toggle('is-busy', on);
          if (on) clearNotice();
        }

        forgot.addEventListener('click', () => showNotice('info', 'Fale com o administrador da fazenda para redefinir a senha.'));
      })();
    </script>
  </body>
</html>
